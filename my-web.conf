server {
    listen 80;
    server_name _;

    # Thư mục web root chính của trang web
    root /var/www/my-web/html;
    index index.html index.htm;

    # Xử lý các request thông thường đến website
    location / {
        try_files $uri $uri/ =404;
    }

    # Bảo vệ thư mục quản trị nội bộ /admin bằng HTTP Basic Authentication
    # Yêu cầu người dùng phải cung cấp tài khoản/mật khẩu hợp lệ trong .htpasswd
    location /admin {
        auth_basic "Restricted Admin Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ =404;
    }
}
